name: Verify ChatGPT High Sierra installer

on:
  push:
    branches:
      - main
    paths:
      - "scripts/install-chatgpt-high-sierra.sh"
      - ".github/workflows/high-sierra-chatgpt-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-sierra-chatgpt-installer
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install real OpenAI compatibility app
        shell: bash
        run: |
          set -euo pipefail
          export CHATGPT_HIGH_SIERRA_INSTALL_BASE="$RUNNER_TEMP/Applications"
          export CHATGPT_HIGH_SIERRA_NO_LAUNCH=1
          bash scripts/install-chatgpt-high-sierra.sh | tee "$RUNNER_TEMP/install.log"

      - name: Verify bundled Codex app-server startup gate
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Applications/ChatGPT.app"
          cli="$app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"
          test -x "$cli"
          python3 - "$cli" "$RUNNER_TEMP/app-server-probe.jsonl" <<'PY'
import json, subprocess, sys, time

cli, output_path = sys.argv[1:3]
p = subprocess.Popen(
    [cli, "app-server"],
    stdin=subprocess.PIPE,
    stdout=subprocess.PIPE,
    stderr=subprocess.PIPE,
    text=True,
    bufsize=1,
)
requests = [
    {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"clientInfo":{"name":"high-sierra-verify","version":"1.0.0"}}},
    {"jsonrpc":"2.0","method":"initialized"},
    {"jsonrpc":"2.0","id":2,"method":"configRequirements/read"},
]
payload = "\n".join(json.dumps(x, separators=(",",":")) for x in requests) + "\n"
try:
    out, err = p.communicate(payload, timeout=20)
except subprocess.TimeoutExpired:
    p.kill()
    out, err = p.communicate()
    print("app-server probe timed out", file=sys.stderr)
    print(err[-4000:], file=sys.stderr)
    raise SystemExit(1)

open(output_path, "w").write(out)
print(out)
if err:
    print(err[-4000:], file=sys.stderr)

responses = []
for line in out.splitlines():
    try:
        msg = json.loads(line)
    except Exception:
        continue
    if "id" in msg:
        responses.append(msg)

by_id = {str(m.get("id")): m for m in responses}
init = by_id.get("1")
req = by_id.get("2")
if not init or "result" not in init:
    raise SystemExit("initialize did not return a result")
if not req or "result" not in req:
    raise SystemExit("configRequirements/read did not return a result")
print("bundled_app_server_startup_gate=pass")
PY

      - name: Verify bundled Codex app-server startup policy handshake
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Applications/ChatGPT.app"
          codex="$app/Contents/Resources/codex-cli/bin/codex"
          export CODEX_HOME="$RUNNER_TEMP/codex-home-app-server-probe"
          mkdir -p "$CODEX_HOME"

          python3 - "$codex" "$RUNNER_TEMP/app-server-probe.jsonl" <<'PY'
          import json, os, selectors, subprocess, sys, time

          codex, output_path = sys.argv[1:3]
          proc = subprocess.Popen(
              [codex, "app-server", "--stdio"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
              env=os.environ.copy(),
          )
          sel = selectors.DefaultSelector()
          sel.register(proc.stdout, selectors.EVENT_READ, "stdout")
          sel.register(proc.stderr, selectors.EVENT_READ, "stderr")

          transcript = []
          def send(obj):
              line = json.dumps(obj, separators=(",", ":"))
              transcript.append({"send": obj})
              proc.stdin.write(line + "\n")
              proc.stdin.flush()

          send({
              "id": 1,
              "method": "initialize",
              "params": {
                  "clientInfo": {
                      "name": "chatgpt-high-sierra-probe",
                      "title": "ChatGPT High Sierra Probe",
                      "version": "1.0.0"
                  },
                  "capabilities": {"experimentalApi": True}
              }
          })

          deadline = time.time() + 20
          initialized = False
          requirements = None
          while time.time() < deadline and proc.poll() is None:
              events = sel.select(timeout=0.5)
              for key, _ in events:
                  line = key.fileobj.readline()
                  if not line:
                      continue
                  if key.data == "stderr":
                      transcript.append({"stderr": line.rstrip()})
                      continue
                  transcript.append({"stdout": line.rstrip()})
                  try:
                      msg = json.loads(line)
                  except Exception:
                      continue
                  if msg.get("id") == 1:
                      if "error" in msg:
                          raise SystemExit("initialize error: " + json.dumps(msg))
                      initialized = True
                      send({"id": 2, "method": "configRequirements/read"})
                  elif msg.get("id") == 2:
                      if "error" in msg:
                          raise SystemExit("configRequirements/read error: " + json.dumps(msg))
                      requirements = msg.get("result")
                      break
              if requirements is not None:
                  break

          with open(output_path, "w") as fh:
              for row in transcript:
                  fh.write(json.dumps(row) + "\n")

          if not initialized:
              raise SystemExit("bundled Codex app-server did not initialize")
          if requirements is None:
              raise SystemExit("bundled Codex app-server did not answer configRequirements/read")

          print("Bundled Codex app-server initialize: OK")
          print("configRequirements/read:", json.dumps(requirements, sort_keys=True))
          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()
          PY

      - name: Verify bundle and real renderer
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Applications/ChatGPT.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.openai.codex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "10.13"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "Electron"
          test -f "$app/Contents/Resources/app.asar"
          test -x "$app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"
          "$app/Contents/Resources/codex-cli/bin/codex" --version

          CODEX_CLI_PATH="$app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex" \
          "$app/Contents/MacOS/Electron" \
            --remote-debugging-port=9231 \
            --disable-gpu \
            --no-sandbox \
            --enable-logging=stderr \
            >"$RUNNER_TEMP/chatgpt-installed-stdout.log" \
            2>"$RUNNER_TEMP/chatgpt-installed-stderr.log" &
          pid=$!

          cleanup() {
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          captured=false
          for _ in {1..30}; do
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              break
            fi
            if curl -fsS "http://127.0.0.1:9231/json/list" -o "$RUNNER_TEMP/chatgpt-installed-cdp.json"; then
              if python3 -c 'import json,sys; items=json.load(open(sys.argv[1])); pages=[x for x in items if x.get("type") in ("page","webview")]; print(json.dumps([{"type":x.get("type"),"title":x.get("title"),"url":x.get("url")} for x in pages], indent=2)); raise SystemExit(0 if pages else 1)' "$RUNNER_TEMP/chatgpt-installed-cdp.json"; then
                captured=true
                break
              fi
            fi
            sleep 1
          done

          if [[ "$captured" != "true" ]]; then
            echo "Installed real ChatGPT app did not expose a renderer." >&2
            tail -300 "$RUNNER_TEMP/chatgpt-installed-stderr.log" >&2 || true
            exit 1
          fi
