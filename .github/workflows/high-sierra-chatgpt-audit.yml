name: Audit real ChatGPT app for High Sierra

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-chatgpt-high-sierra.sh"
      - ".github/workflows/high-sierra-chatgpt-audit.yml"

permissions:
  contents: read

jobs:
  audit-official-intel-app:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Audit official OpenAI Intel ChatGPT app
        run: bash scripts/audit-chatgpt-high-sierra.sh "$RUNNER_TEMP/chatgpt-high-sierra-audit"

      - name: Upload audit only
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-high-sierra-real-app-audit
          path: |
            ${{ runner.temp }}/chatgpt-high-sierra-audit/report.txt
            ${{ runner.temp }}/chatgpt-high-sierra-audit/macho-minos.tsv
            ${{ runner.temp }}/chatgpt-high-sierra-audit/native-node-modules.tsv
            ${{ runner.temp }}/chatgpt-high-sierra-audit/high-sierra-blockers.txt
            ${{ runner.temp }}/chatgpt-high-sierra-audit/asar/package.json
          if-no-files-found: warn
