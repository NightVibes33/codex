name: Force cancel stale High Sierra run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-cancel-high-sierra.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel superseded runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/36919180689/force-cancel" >/dev/null 2>&1 || true
