name: Build Electron 26 native modules

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-electron26-native-modules.sh"
      - ".github/workflows/electron26-native-modules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron26-native-modules
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Electron 26 native compatibility pack
        # Rebuild OpenAI's Owl-targeted native addons for Electron 26 / ABI 116.
        run: bash scripts/build-electron26-native-modules.sh "$RUNNER_TEMP/native"
      - name: Inspect native binaries
        run: |
          file "$RUNNER_TEMP/native/better-sqlite3/build/Release/better_sqlite3.node"
          file "$RUNNER_TEMP/native/node-pty/build/Release/pty.node"
          otool -L "$RUNNER_TEMP/native/better-sqlite3/build/Release/better_sqlite3.node"
          otool -L "$RUNNER_TEMP/native/node-pty/build/Release/pty.node"
          cat "$RUNNER_TEMP/native/BUILD-INFO.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: electron26-native-darwin-x64
          path: |
            ${{ runner.temp }}/native/electron26-native-darwin-x64.tar.gz
            ${{ runner.temp }}/native/SHA256SUMS
            ${{ runner.temp }}/native/BUILD-INFO.txt
          if-no-files-found: error

      - name: Publish rolling Electron 26 native pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="high-sierra-electron26-native"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"               -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag"               --title "ChatGPT Electron 26 native modules (rolling)"               --prerelease               --notes "x86_64 native modules rebuilt for Electron 26 / macOS 10.13 compatibility."
          fi

          gh release upload "$tag"             "$RUNNER_TEMP/native/electron26-native-darwin-x64.tar.gz"             "$RUNNER_TEMP/native/SHA256SUMS"             "$RUNNER_TEMP/native/BUILD-INFO.txt"             --clobber
